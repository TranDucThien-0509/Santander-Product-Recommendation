workerPoolSpecs:
  - machineSpec:
      machineType: e2-standard-8
    replicaCount: 1
    containerSpec:
      imageUri: us-central1-docker.pkg.dev/santander-ds/santander-repo/santander-pipeline:32f17f8
      env:
        - name: SANTANDER_SAMPLE_ROWS
          value: "1000000"
        - name: SANTANDER_INPUT_DIR
          value: "/gcs/uit-thien-santander-ds/raw"
        - name: SANTANDER_SAMPLES_DIR
          value: "/gcs/uit-thien-santander-ds/samples"
        - name: SANTANDER_WORK_DIR
          value: "/gcs/uit-thien-santander-ds/run_1m"
        - name: SANTANDER_IMAGE_TAG
          value: "32f17f8"
