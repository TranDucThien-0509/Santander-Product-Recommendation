name: Track A customer analytics
on:
  push:
    paths:
      - 'research/track_a/**'
      - 'experiments/event_pipeline_v2/track_a/**'
      - 'experiments/event_pipeline_v2/pipeline/**'
      - 'experiments/event_pipeline_v2/requirements-track-a.txt'
      - 'experiments/event_pipeline_v2/tests/test_track_a.py'
      - '.github/workflows/track-a.yml'
  pull_request:
    paths:
      - 'research/track_a/**'
      - 'experiments/event_pipeline_v2/track_a/**'
      - 'experiments/event_pipeline_v2/pipeline/**'
      - 'experiments/event_pipeline_v2/requirements-track-a.txt'
      - 'experiments/event_pipeline_v2/tests/test_track_a.py'
      - '.github/workflows/track-a.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MLFLOW_DISABLE_AGENT_HINT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: experiments/event_pipeline_v2/requirements-track-a.txt
      - run: python -m pip install -r experiments/event_pipeline_v2/requirements-track-a.txt -r research/track_a/requirements-demo.txt -e research/track_a
      - run: python -m unittest discover -s research/track_a/tests -v
      - run: python -m unittest discover -s tests -p test_track_a.py -v
        working-directory: experiments/event_pipeline_v2
      - run: python -m track_a.run --help
        working-directory: experiments/event_pipeline_v2
      - run: python -m track_a.storage --help
        working-directory: experiments/event_pipeline_v2
      - run: python research/track_a/scripts/build_track_a_review.py --execute
