name: Santander ML Pipeline CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  smoke-test:
    name: Smoke Test & Offline Validation (Sample 10k)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run End-to-End Pipeline (Sample Mode)
        env:
          SANTANDER_SAMPLE_ROWS: "10000"
          SANTANDER_INPUT_DIR: "data/raw"
        run: |
          python pipeline/run_pipeline.py

      - name: Run Comprehensive Smoke Tests
        run: |
          python pipeline/smoke_test.py

      - name: Upload Run Artifacts & Log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-run-artifacts
          path: |
            pipeline/artifacts/pipeline_run_log.jsonl
            pipeline/artifacts/eval_metrics.json
            sub.csv
          retention-days: 7

  build-docker:
    name: Build & Verify Docker Container
    needs: smoke-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (Verify compilation)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: santander-pipeline:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-gcp:
    name: Push to GCP Artifact Registry
    needs: [smoke-test, build-docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if GCP credentials secret exists
        id: check_creds
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -n "$GCP_SA_KEY" ]; then
            echo "has_creds=true" >> $GITHUB_OUTPUT
          else
            echo "has_creds=false" >> $GITHUB_OUTPUT
            echo "Notice: GCP_SA_KEY secret not found in repository. Skipping push to GCP Artifact Registry."
          fi

      - name: Authenticate to Google Cloud
        if: steps.check_creds.outputs.has_creds == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: steps.check_creds.outputs.has_creds == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        if: steps.check_creds.outputs.has_creds == 'true'
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and Push Docker image to GCP
        if: steps.check_creds.outputs.has_creds == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            us-central1-docker.pkg.dev/santander-ds/santander-repo/santander-pipeline:latest
            us-central1-docker.pkg.dev/santander-ds/santander-repo/santander-pipeline:${{ github.sha }}
