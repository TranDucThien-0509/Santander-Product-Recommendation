name: Santander ML Pipeline CI/CD

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  smoke-test:
    name: Smoke Test & Offline Validation (Sample 10k)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run End-to-End Pipeline (Sample Mode)
        env:
          SANTANDER_SAMPLE_ROWS: "10000"
          SANTANDER_INPUT_DIR: "data/raw"
        run: |
          python pipeline/run_pipeline.py

      - name: Run Comprehensive Smoke Tests
        run: |
          python pipeline/smoke_test.py

      - name: Upload Run Artifacts & Log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-run-artifacts
          path: |
            pipeline/artifacts/pipeline_run_log.jsonl
            pipeline/artifacts/eval_metrics.json
            sub.csv
          retention-days: 7

  build-docker:
    name: Build & Verify Docker Container
    needs: smoke-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (Verify compilation)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: santander-pipeline:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-gcp:
    name: Push to GCP Artifact Registry (Main Only)
    needs: [smoke-test, build-docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          project_id: 'santander-ds'
          workload_identity_provider: 'projects/180747094471/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-actions-sa@santander-ds.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker image to GCP
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            us-central1-docker.pkg.dev/santander-ds/santander-repo/santander-pipeline:latest
            us-central1-docker.pkg.dev/santander-ds/santander-repo/santander-pipeline:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
